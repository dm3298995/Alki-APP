<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Reparar ALKI</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#FAF8F4">
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box;
      font-family: -apple-system, system-ui, 'Segoe UI', sans-serif; background: #FAF8F4; color: #111418; }
    main { max-width: 380px; text-align: center; }
    h1 { color: #16325C; font-size: 1.6rem; font-weight: 600; letter-spacing: -0.02em; margin: 0 0 8px; }
    p { color: #5B6270; line-height: 1.5; margin: 0 0 22px; }
    a, button { display: inline-block; border: 0; border-radius: 9999px; background: #16325C; color: #FAF8F4; padding: 13px 24px;
      font: inherit; font-weight: 600; text-decoration: none; cursor: pointer; margin: 4px; }
    .sec { background: transparent; color: #16325C; border: 1.5px solid #7C8699; }
  </style>
</head>
<body>
  <main>
    <h1 id="titulo">Reparando la app…</h1>
    <p id="texto">Estamos borrando la versión antigua guardada en este móvil.</p>
    <div id="botones" hidden>
      <a href="./index.html">Abrir la app</a>
      <a class="sec" href="./panel.html">Abrir el panel</a>
    </div>
  </main>
  <script>
    /* Borra la copia antigua de la app (service worker y caché) y los datos de prueba
       guardados en este navegador. Después la app se descarga de nuevo, limpia. */
    (async function () {
      try {
        if ('serviceWorker' in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map((r) => r.unregister()));
        }
        if (window.caches) {
          const claves = await caches.keys();
          await Promise.all(claves.map((k) => caches.delete(k)));
        }
        try { localStorage.clear(); sessionStorage.clear(); } catch (e) { /* nada */ }
        try { indexedDB.deleteDatabase('alki-fotos'); } catch (e) { /* nada */ }
      } catch (e) { /* aunque falle algo, se puede volver a intentar */ }
      document.getElementById('titulo').textContent = 'Listo';
      document.getElementById('texto').textContent = 'La app está limpia. Ábrela de nuevo.';
      document.getElementById('botones').hidden = false;
    })();
  </script>
</body>
</html>
