<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ALKI Rentals</title>
  <meta name="description" content="App de ALKI Rentals para inquilinos y propietarios: contratos, pagos, incidencias y estado de las viviendas.">
  <meta name="theme-color" content="#FAF8F4">

  <!-- PWA: permite instalar la web en el móvil como si fuera una app -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icon-180.png">
  <!-- iPhone: al añadirla a la pantalla de inicio se abre a pantalla completa, como una app -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="ALKI">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <link rel="preload" href="assets/fonts/jakarta.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/inter.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/marca.css">
</head>
<body class="cuerpo-app cuerpo-marca">
  <!-- Si algo falla al arrancar, en vez de una pantalla en blanco se ve un aviso con el motivo
       y un botón para reparar la app (escrito en JavaScript antiguo para que funcione en cualquier móvil) -->
  <script>
    (function () {
      var fallos = [];
      window.addEventListener('error', function (e) { fallos.push((e.message || 'Error') + (e.filename ? ' (' + e.filename.split('/').pop() + ':' + e.lineno + ')' : '')); });
      window.addEventListener('unhandledrejection', function (e) { fallos.push('Promesa: ' + (e.reason && e.reason.message || e.reason)); });
      window.addEventListener('load', function () {
        setTimeout(function () {
          var app = document.getElementById('app');
          if (app && app.children.length) return;
          var caja = document.createElement('div');
          caja.setAttribute('style', 'max-width:380px;margin:18vh auto 0;padding:24px;text-align:center;font-family:-apple-system,system-ui,sans-serif;color:#111418');
          caja.innerHTML = '<h1 style="color:#16325C;font-size:1.5rem;margin:0 0 8px">La app no ha podido arrancar</h1>' +
            '<p style="color:#5B6270;margin:0 0 20px">Suele ser una versión antigua guardada en el móvil. Pulsa reparar y vuelve a entrar.</p>' +
            '<a href="reparar.html" style="display:inline-block;background:#16325C;color:#FAF8F4;border-radius:9999px;padding:13px 24px;font-weight:600;text-decoration:none">Reparar la app</a>' +
            (fallos.length ? '<p style="margin-top:22px;font-size:12px;color:#7C8699;word-break:break-word">Detalle: ' + fallos.slice(0, 3).join(' · ').replace(/</g, '&lt;') + '</p>' : '');
          document.body.appendChild(caja);
        }, 2500);
      });
    })();
  </script>

  <!-- Aquí app.js pinta la pantalla que toca en cada momento -->
  <div id="app"></div>
  <!-- Contenedor para las ventanas emergentes (modales) -->
  <div id="modal-root"></div>
  <!-- Avisos breves ("Incidencia enviada", etc.) -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <noscript>Esta app necesita JavaScript activado.</noscript>

  <!-- El orden importa: primero los datos, luego la lógica y al final las pantallas -->
  <script src="js/config.js"></script>
  <script src="js/demo-csv.js"></script>
  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/views/legal.js"></script>
  <script src="js/views/comunes.js"></script>
  <script src="js/views/login.js"></script>
  <script src="js/views/inquilino.js"></script>
  <script src="js/views/propietario.js"></script>
  <script src="js/views/admin.js"></script>
  <script src="js/views/social.js"></script>
  <script src="js/app.js"></script>
  <!-- Versión de prueba, opiniones y estadísticas (ver js/config.js) -->
  <script src="js/medicion.js"></script>
</body>
</html>
